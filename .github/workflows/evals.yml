name: Run Evaluations

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 1,15 * *"
  push: #Trigger on all commits except dependency updates and CI-only changes
    paths-ignore:
      - 'go.mod'
      - 'go.sum'
      - '.github/**'
      - '**.md'

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      reponames: ${{ steps.set-matrix.outputs.reponames }}
      modelnames: ${{ steps.set-matrix.outputs.modelnames }}
    steps:
      - id: set-matrix
        run: |
          echo 'modelnames=["gemini-2.5-flash","gemini-3-flash","openai-gpt5.2","openai-gpt5.2-codex","claude-4.5-sonnet","claude-4.5-haiku"]' >> $GITHUB_OUTPUT
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo 'reponames=["saist-playground"]' >> $GITHUB_OUTPUT
          else
            echo 'reponames=["saist-playground","BenchmarkJava","vulnpy-ibmappsec","gowasp"]' >> $GITHUB_OUTPUT
          fi

  evaluations:
    needs: setup-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        reponame: ${{ fromJson(needs.setup-matrix.outputs.reponames) }}
        modelname: ${{ fromJson(needs.setup-matrix.outputs.modelnames) }}
    permissions:
      contents: read
      id-token: write  # Needed for dd-octo-sts
    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Get access token for evals repo
      id: octo-sts
      uses: DataDog/dd-octo-sts-action@acaa02eee7e3bb0839e4272dacb37b8f3b58ba80 # v1.0.3
      with:
        scope: DataDog/datadog-saist-evals
        policy: evals

    - name: Checkout private evals repo
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        repository: DataDog/datadog-saist-evals
        ref: 'main'
        token: ${{ steps.octo-sts.outputs.token }}
        path: tmp/datadog-saist-evals

    - name: Set up Go
      uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
      with:
        go-version: '1.24'
        
    - name: Cache Go modules
      uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
          
    - name: Download dependencies
      run: go mod download
      
    - name: Run tests
      run: go test -v -race -cover ./...

    - name: Build binary
      run: go build -o datadog-saist ./cmd/datadog-saist

    - name: Build binary
      run: cp datadog-saist ${GITHUB_WORKSPACE}/tmp/datadog-saist-evals/datadog-saist

    - name: Start Datadog Agent
      env:
        DD_API_KEY: ${{ secrets.DD_API_KEY }}
        DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        DD_SITE: ${{ vars.METRIC_UPLOAD_DD_SITE }}
        DD_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
        DD_SERVICE: datadog-saist
        DD_VERSION: ${{ github.sha }}
      run: |
        # Install Datadog Agent
        DD_AGENT_MAJOR_VERSION=7 DD_API_KEY=$DD_API_KEY DD_SITE=$DD_SITE bash -c "$(curl -L https://s3.amazonaws.com/dd-agent/scripts/install_script.sh)"
        
        # Configure the agent
        sudo tee /etc/datadog-agent/datadog.yaml > /dev/null <<EOF
        api_key: $DD_API_KEY
        site: $DD_SITE
        logs_enabled: true
        process_config:
          enabled: true
        apm_config:
          enabled: true
        tags:
          - version:$DD_VERSION
          - analyzer_sha:${{ github.sha }}
        EOF
        
        # Start the agent
        sudo systemctl start datadog-agent
        sudo systemctl enable datadog-agent
        
        # Wait for agent to be ready
        sleep 30
        
        # Verify agent status
        sudo datadog-agent status
        
    - name: Run evals
      env:
        DD_API_KEY: ${{ secrets.DD_API_KEY }}
        DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        DD_SITE: ${{ vars.DD_SITE || 'datadoghq.com' }}
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        cd ${GITHUB_WORKSPACE}/tmp/datadog-saist-evals
        make build-run VALIDATION_MODEL=${{ matrix.modelname }} DETECTION_MODEL=${{ matrix.modelname }} REPO=${{ matrix.reponame }} SEND_METRICS=true JSON_OUTPUT=/tmp/eval-metrics.json

    - name: Upload eval metrics artifact
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: eval-metrics-${{ matrix.reponame }}-${{ matrix.modelname }}
        path: /tmp/eval-metrics.json
        if-no-files-found: warn
        retention-days: 90

    - name: Flush metrics before shutdown
      run: |
        # Send a test metric to trigger flush
        echo "test.flush:1|c" | nc -u -w1 localhost 8125 || true
  
        # Wait for natural flush cycle (happens every 15-20 seconds)
        sleep 20
  
        # Check final agent status
        sudo datadog-agent status

  eval-summary:
    name: Post eval summary comment
    needs: [setup-matrix, evaluations]
    if: always() && github.event_name == 'push' && github.ref_name != 'main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Download current eval artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        pattern: eval-metrics-saist-playground-*
        path: /tmp/current-metrics/
        merge-multiple: false

    - name: Find and download baseline artifacts
      id: baseline
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        models=($(echo '${{ needs.setup-matrix.outputs.modelnames }}' | python3 -c "import json,sys; print(' '.join(json.load(sys.stdin)))"))

        baseline_run_id=""
        for event in schedule workflow_dispatch; do
          branch_filter="&branch=main"
          run_id=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/evals.yml/runs?event=${event}&status=completed${branch_filter}" \
            --jq '.workflow_runs[0].id')

          if [[ -z "$run_id" || "$run_id" == "null" ]]; then
            continue
          fi

          echo "Trying to download artifact from ${event} run $run_id"
          if gh run download "$run_id" \
            --name "eval-metrics-saist-playground-${models[0]}" \
            --dir "/tmp/baseline-metrics/${models[0]}/"; then
            baseline_run_id="$run_id"
            break
          fi
        done

        if [[ -z "$baseline_run_id" ]]; then
          echo "No baseline found, skipping summary"
          echo "found=false" >> $GITHUB_OUTPUT
          exit 0
        fi

        for model in "${models[@]:1}"; do
          gh run download "$baseline_run_id" \
            --name "eval-metrics-saist-playground-${model}" \
            --dir "/tmp/baseline-metrics/${model}/" 2>/dev/null || true
        done

        echo "found=true" >> $GITHUB_OUTPUT
        echo "run_id=$baseline_run_id" >> $GITHUB_OUTPUT

    - name: Post summary comment
      if: steps.baseline.outputs.found == 'true'
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
        BASELINE_RUN_ID: ${{ steps.baseline.outputs.run_id }}
        REPO: ${{ github.repository }}
        COMMIT_SHA: ${{ github.sha }}
        BRANCH: ${{ github.ref_name }}
        MODELNAMES: ${{ needs.setup-matrix.outputs.modelnames }}
      run: |
        python3 - <<'EOF'
        import json, os, subprocess
        from pathlib import Path

        models = json.loads(os.environ["MODELNAMES"])
        threshold = 0.10
        any_regression = False
        rows = []

        for model in models:
            current_path = Path(f"/tmp/current-metrics/eval-metrics-saist-playground-{model}/eval-metrics.json")
            baseline_path = Path(f"/tmp/baseline-metrics/{model}/eval-metrics.json")

            if not current_path.exists():
                rows.append(f"| `{model}` | — | — | — | ⚠️ no results |")
                continue

            current = json.loads(current_path.read_text())

            if not baseline_path.exists():
                f1 = current.get("f1", "—")
                p = current.get("precision", "—")
                r = current.get("recall", "—")
                fmt = lambda v: f"{v:.3f}" if isinstance(v, float) else v
                rows.append(f"| `{model}` | {fmt(f1)} | {fmt(p)} | {fmt(r)} | — no baseline |")
                continue

            baseline = json.loads(baseline_path.read_text())

            def fmt_delta(metric):
                c, b = current.get(metric), baseline.get(metric)
                if c is None or b is None:
                    return "—"
                delta = c - b
                sign = "+" if delta >= 0 else ""
                return f"{b:.3f} → {c:.3f} ({sign}{delta:.3f})"

            f1_c, f1_b = current.get("f1"), baseline.get("f1")
            regression = f1_c is not None and f1_b is not None and (f1_c - f1_b) < -threshold
            if regression:
                any_regression = True
                print(f"::warning::F1 regression for {model}: {f1_b:.3f} -> {f1_c:.3f}")

            status = "⚠️" if regression else "✅"
            rows.append(f"| `{model}` | {fmt_delta('f1')} | {fmt_delta('precision')} | {fmt_delta('recall')} | {status} |")

        baseline_run_id = os.environ["BASELINE_RUN_ID"]
        repo = os.environ["REPO"]
        commit = os.environ["COMMIT_SHA"]
        branch = os.environ["BRANCH"]
        baseline_url = f"https://github.com/{repo}/actions/runs/{baseline_run_id}"

        header = "⚠️ **Eval regressions detected** for `saist-playground`" if any_regression else "✅ **Evals passed** for `saist-playground`"
        table = "\n".join([
            "| Model | F1 | Precision | Recall | |",
            "|-------|-----|-----------|--------|---|",
        ] + rows)

        body = f"{header}\n\n**Commit:** {commit}\n**Baseline:** [run {baseline_run_id}]({baseline_url})\n\n{table}"

        result = subprocess.run(
            ["gh", "pr", "comment", branch, "--repo", repo, "--body", body, "--edit-last"],
        )
        if result.returncode != 0:
            # No existing comment to edit, create a new one
            subprocess.run(
                ["gh", "pr", "comment", branch, "--repo", repo, "--body", body],
                check=True
            )
        EOF

  ddeval:
    name: Run ddeval LLMObs experiment
    needs: [setup-matrix, evaluations]
    if: always()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        reponame: ${{ fromJson(needs.setup-matrix.outputs.reponames) }}
        detection_model: ${{ fromJson(needs.setup-matrix.outputs.modelnames) }}
    permissions:
      contents: read
      id-token: write  # Needed for dd-octo-sts
    steps:
    - name: Checkout datadog-saist
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Get access token for evals repo
      id: octo-sts
      uses: DataDog/dd-octo-sts-action@08f2144903ced3254a3dafec2592563409ba2aa0 # v1.0.1
      with:
        scope: DataDog/datadog-saist-evals
        policy: evals

    - name: Checkout datadog-saist-evals
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        repository: DataDog/datadog-saist-evals
        ref: 'main'
        token: ${{ steps.octo-sts.outputs.token }}
        path: tmp/datadog-saist-evals

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: '1.24'

    - name: Cache Go modules
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Build datadog-saist binary
      run: go build -o datadog-saist ./cmd/datadog-saist

    - name: Build datadog-saist-evals binary
      run: |
        cd tmp/datadog-saist-evals
        go build -o datadog-saist-evals ./cmd/datadog-saist-evals

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.12'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Install ddeval dependencies
      id: ddeval-install
      continue-on-error: true
      run: |
        cd tmp/datadog-saist-evals/eval
        uv sync

    - name: Run ddeval experiment
      id: ddeval-run
      if: steps.ddeval-install.outcome == 'success'
      continue-on-error: true
      env:
        DD_API_KEY: ${{ secrets.DD_API_KEY }}
        DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        DD_SITE: ${{ vars.METRIC_UPLOAD_DD_SITE }}
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        EVALS_ROOT="${GITHUB_WORKSPACE}/tmp/datadog-saist-evals"

        cat > /tmp/experiment_config.json << EOF
        {
          "input_parameters": {
            "detection_model": "${{ matrix.detection_model }}",
            "validation_model": "${{ matrix.detection_model }}"
          },
          "executor_config": {
            "evals_root": "${EVALS_ROOT}",
            "evals_bin": "${EVALS_ROOT}/datadog-saist-evals",
            "saist_bin": "${GITHUB_WORKSPACE}/datadog-saist",
            "file_concurrency": 50,
            "send_metrics": true,
            "repo": "${{ matrix.reponame }}"
          }
        }
        EOF

        cd tmp/datadog-saist-evals/eval
        uv run ddeval run \
          --project k9-saist \
          --dataset k9-saist-benchmark \
          --experiment-config-file /tmp/experiment_config.json \
          --yes

    - name: Download pre-computed eval metrics
      if: steps.ddeval-install.outcome == 'failure' || steps.ddeval-run.outcome == 'failure'
      continue-on-error: true
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: eval-metrics-${{ matrix.reponame }}-${{ matrix.detection_model }}
        path: /tmp/eval-metrics/

    - name: Install LLMObs eval dependencies (fallback)
      if: steps.ddeval-install.outcome == 'failure' || steps.ddeval-run.outcome == 'failure'
      run: pip install "ddtrace>=4.8.4"

    - name: Run LLMObs experiment (fallback)
      if: steps.ddeval-install.outcome == 'failure' || steps.ddeval-run.outcome == 'failure'
      env:
        DD_API_KEY: ${{ secrets.DD_API_KEY }}
        DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        DD_SITE: ${{ secrets.DD_SITE }}
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        DETECTION_MODEL: ${{ matrix.detection_model }}
        FILTER_REPO: ${{ matrix.reponame }}
        PRECOMPUTED_METRICS: /tmp/eval-metrics/eval-metrics.json
        EVALS_ROOT: ${{ github.workspace }}/tmp/datadog-saist-evals
        EVALS_BIN: ${{ github.workspace }}/tmp/datadog-saist-evals/datadog-saist-evals
        SAIST_BIN: ${{ github.workspace }}/datadog-saist
      run: python .github/scripts/run_llmobs_eval.py
